<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Naija Feud</title>
<style>
:root{
  --green:#0A7A3D;
  --green-dk:#065C2C;
  --ivory:#F7F3E8;
  --ink:#1B1B1B;
  --gold:#D4A017;
  --gold-lt:#F0C64B;
  --red:#C1432E;
  --panel:#FFFFFF;
  --shadow: 0 6px 18px rgba(0,0,0,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--ivory);
  color:var(--ink);
  overflow-x:hidden;
  min-height:100vh;
}
.display{
  font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.03em;
}
.stripe-band{
  height:14px;
  width:100%;
  background:repeating-linear-gradient(
    -45deg,
    var(--green) 0px, var(--green) 18px,
    var(--gold) 18px, var(--gold) 24px,
    var(--green-dk) 24px, var(--green-dk) 42px,
    var(--gold) 42px, var(--gold) 48px
  );
  flex-shrink:0;
}
.screen{
  display:none;
  min-height:100vh;
  flex-direction:column;
}
.screen.active{display:flex;}
.container{
  max-width:720px;
  margin:0 auto;
  width:100%;
  padding:20px 18px 40px;
  flex:1;
  display:flex;
  flex-direction:column;
}
/* ---------- Header / wordmark ---------- */
.wordmark{
  text-align:center;
  padding:22px 0 10px;
}
.wordmark h1{
  margin:0;
  font-size:clamp(34px,9vw,54px);
  color:var(--green-dk);
  line-height:.95;
}
.wordmark h1 span{color:var(--gold);}
.wordmark p{
  margin:6px 0 0;
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  opacity:.55;
  font-weight:600;
}
/* ---------- Buttons ---------- */
.btn{
  display:block;
  width:100%;
  border:none;
  border-radius:14px;
  padding:16px 20px;
  font-size:17px;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  text-align:center;
  box-shadow:var(--shadow);
  transition:transform .08s ease;
  font-family:inherit;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green); color:#fff;}
.btn-gold{background:var(--gold); color:var(--ink);}
.btn-outline{background:#fff; color:var(--green-dk); border:2px solid var(--green);}
.btn-red{background:var(--red); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink); box-shadow:none; text-decoration:underline; opacity:.65; font-weight:600;}
.btn-sm{padding:10px 14px; font-size:13px; border-radius:10px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
.stack{display:flex; flex-direction:column; gap:12px;}
/* ---------- Cards ---------- */
.card{
  background:var(--panel);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
}
.eyebrow{
  font-size:12px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--green-dk);
  opacity:.7;
  margin:0 0 6px;
}
label.field-label{
  display:block;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink);
  opacity:.6;
  margin:0 0 6px;
}
input[type=text], textarea{
  width:100%;
  border:2px solid #e4ded0;
  border-radius:10px;
  padding:12px 14px;
  font-size:16px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
}
input[type=text]:focus, textarea:focus{outline:none; border-color:var(--green);}
textarea{resize:vertical; min-height:90px; font-family:monospace; font-size:12px;}
/* ---------- Board ---------- */
.board-wrap{
  background:var(--green-dk);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.board-wrap::before{
  content:"";
  position:absolute; inset:0;
  background:repeating-linear-gradient(-45deg, rgba(212,160,23,.07) 0 10px, transparent 10px 20px);
  pointer-events:none;
}
.question-text{
  color:#fff;
  font-size:17px;
  font-weight:700;
  text-align:center;
  padding:6px 10px 14px;
  line-height:1.35;
  position:relative;
}
.slots{
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
}
.slot{
  background:var(--green);
  border-radius:10px;
  height:52px;
  display:flex;
  align-items:center;
  padding:0 16px;
  position:relative;
  perspective:800px;
  cursor:pointer;
  border:2px solid rgba(255,255,255,.15);
}
.slot-inner{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:transform .5s;
  transform-style:preserve-3d;
}
.slot.revealed .slot-inner{transform:rotateX(360deg);}
.slot-num{
  width:26px; height:26px;
  border-radius:50%;
  background:var(--gold);
  color:var(--ink);
  font-weight:800;
  font-size:13px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.slot-text{
  flex:1;
  color:#fff;
  font-weight:800;
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:.02em;
  padding:0 10px;
  opacity:0;
}
.slot.revealed .slot-text{opacity:1;}
.slot.hidden .slot-text{opacity:0;}
.slot-points{
  background:var(--gold);
  color:var(--ink);
  font-weight:800;
  font-size:14px;
  padding:4px 10px;
  border-radius:6px;
  min-width:38px;
  text-align:center;
  opacity:0;
}
.slot.revealed .slot-points{opacity:1;}
.slot-placeholder{
  flex:1;
  text-align:center;
  color:rgba(255,255,255,.35);
  font-size:20px;
  letter-spacing:.3em;
}
.slot.revealed .slot-placeholder{display:none;}
/* strikes */
.strikes{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:16px;
  position:relative;
}
.strike-x{
  width:44px; height:44px;
  opacity:.18;
  transition:opacity .2s, transform .2s;
}
.strike-x.active{opacity:1; animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(.4) rotate(-15deg);} 60%{transform:scale(1.15) rotate(5deg);} 100%{transform:scale(1) rotate(0);}}
/* ---------- Scoreboard ---------- */
.scoreboard{
  display:flex;
  gap:10px;
  margin:14px 0;
}
.score-card{
  flex:1;
  background:#fff;
  border-radius:14px;
  padding:12px 10px;
  text-align:center;
  box-shadow:var(--shadow);
  border-bottom:5px solid var(--green);
  position:relative;
}
.score-card.leading{border-bottom-color:var(--gold);}
.score-card .team-name{
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.score-card .team-score{
  font-size:30px;
  font-weight:900;
  color:var(--green-dk);
  font-family:"Arial Black","Segoe UI Black",Arial,sans-serif;
}
.score-card.active-control{outline:3px solid var(--gold);}
/* ---------- misc ---------- */
.pill{
  display:inline-block;
  background:var(--gold);
  color:var(--ink);
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:999px;
}
.center-text{text-align:center;}
.muted{opacity:.6; font-size:13px;}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.top-bar .qcount{font-size:13px; font-weight:700; opacity:.6;}
.back-link{
  background:none; border:none; color:var(--green-dk);
  font-weight:800; font-size:14px; cursor:pointer; padding:6px 0;
}
.status-banner{
  text-align:center;
  padding:10px 14px;
  border-radius:10px;
  font-weight:800;
  font-size:14px;
  margin-bottom:12px;
  background:#fff3d6;
  color:#8a6a00;
  border:1px solid #f0d580;
}
.status-banner.win{background:#e2f5e9; color:var(--green-dk); border-color:#b7e3c8;}
.status-banner.danger{background:#fbe3de; color:var(--red); border-color:#f0c0b6;}
.guess-row{display:flex; gap:8px; margin-top:10px;}
.guess-row input{flex:1;}
.code-box{
  font-family:monospace;
  font-size:12px;
  word-break:break-all;
  background:#f2ede0;
  border-radius:10px;
  padding:12px;
  border:2px dashed #d8cfb4;
  max-height:120px;
  overflow-y:auto;
}
.divider{
  display:flex; align-items:center; gap:10px;
  margin:18px 0;
  opacity:.4;
  font-size:12px;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.divider::before, .divider::after{content:""; flex:1; height:1px; background:currentColor;}
.spinner{
  width:34px; height:34px;
  border:4px solid #e4ded0;
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}
.confetti-wrap{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
.confetti-piece{
  position:absolute; top:-20px;
  width:9px; height:14px;
  animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9;}}
@media (prefers-reduced-motion: reduce){
  .strike-x.active{animation:none;}
  .slot.revealed .slot-inner{transition:none;}
  .confetti-piece{animation:none; display:none;}
}
/* ---------- QR code + scanner ---------- */
.qr-wrap{
  display:flex;
  justify-content:center;
  padding:14px 0 4px;
}
.qr-wrap svg{
  width:180px;
  height:180px;
  background:#fff;
  border-radius:10px;
  padding:8px;
}
.qr-fallback{
  text-align:center;
  font-size:12px;
  opacity:.6;
  padding:8px 0;
}
.scan-overlay{
  position:fixed; inset:0;
  background:rgba(10,20,14,.94);
  z-index:80;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.scan-overlay video{
  width:min(320px,86vw);
  height:min(320px,86vw);
  object-fit:cover;
  border-radius:16px;
  border:3px solid var(--gold);
}
.scan-overlay p{
  color:#fff;
  margin:16px 0;
  font-size:14px;
  opacity:.85;
  text-align:center;
}
.scan-overlay .btn{max-width:220px;}
</style>
</head>

eople carry in their car boot.", "a": [{"t": "Tyre/jack", "p": 30}, {"t": "Generator", "p": 25}, {"t": "Water", "p": 20}, {"t": "Suitcase", "p": 15}, {"t": "Cables", "p": 10}]}, {"q": "Name a reason a Nigerian mother would shout at her child.", "a": [{"t": "Not eating", "p": 30}, {"t": "Bad grades", "p": 25}, {"t": "Coming home late", "p": 20}, {"t": "Breaking plates", "p": 15}, {"t": "Fighting sibling", "p": 10}]}, {"q": "Name something people ask their \"village people\" to stop doing.", "a": [{"t": "Causing delay", "p": 35}, {"t": "Causing sickness", "p": 25}, {"t": "Stealing luck", "p": 20}, {"t": "Making them spend", "p": 15}, {"t": "Giving bad dreams", "p": 5}]}, {"q": "Name a dish served at a Nigerian wedding.", "a": [{"t": "Jollof rice", "p": 40}, {"t": "Fried rice", "p": 25}, {"t": "Pounded yam", "p": 15}, {"t": "Pepper soup", "p": 10}, {"t": "Moi moi", "p": 10}]}, {"q": "Name something a groom must do before entering the wedding venue.", "a": [{"t": "Pay the dowry", "p": 35}, {"t": "Dance", "p": 25}, {"t": "Kneel down", "p": 20}, {"t": "Spray money", "p": 15}, {"t": "Greet parents", "p": 5}]}, {"q": "Name a question your \"Aunty\" asks you at a family gathering.", "a": [{"t": "When are you getting married?", "p": 40}, {"t": "Where do you work?", "p": 25}, {"t": "Are you eating well?", "p": 20}, {"t": "Why are you thin?", "p": 10}, {"t": "How much is your rent?", "p": 5}]}, {"q": "Name something people fight over in a Nigerian polygamous home.", "a": [{"t": "Land", "p": 30}, {"t": "Husband's attention", "p": 25}, {"t": "Food", "p": 20}, {"t": "Money", "p": 15}, {"t": "Children", "p": 10}]}, {"q": "Name a gift people give to a new baby in Nigeria.", "a": [{"t": "Pampers", "p": 35}, {"t": "Clothes", "p": 25}, {"t": "Cash", "p": 20}, {"t": "Baby wipes", "p": 15}, {"t": "Gold", "p": 5}]}, {"q": "Name a typical \"Nigerian parent\" warning before you travel.", "a": [{"t": "Don't eat anything", "p": 30}, {"t": "Call me when you get there", "p": 25}, {"t": "Don't t <script>
/* ============================================================
   NAIJA FEUD — game engine
   ============================================================ */
const QUESTIONS = JSON.parse(document.getElementById('data-blob').textContent);
window.QUESTIONS = QUESTIONS;

/* ---------------- fuzzy answer matching ---------------- */
function normalize(s){
  return s.toLowerCase()
    .replace(/&/g,' and ')
    .replace(/["'“”‘’]/g,'')
    .replace(/[\/,()!?.]/g,' ')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function levRatio(a,b){
  if(a===b) return 1;
  const al=a.length, bl=b.length;
  if(al===0||bl===0) return 0;
  const dp=Array(al+1).fill(0).map(()=>Array(bl+1).fill(0));
  for(let i=0;i<=al;i++) dp[i][0]=i;
  for(let j=0;j<=bl;j++) dp[0][j]=j;
  for(let i=1;i<=al;i++){
    for(let j=1;j<=bl;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  const dist=dp[al][bl];
  return 1 - dist/Math.max(al,bl);
}
function isMatch(guess, answerText){
  const ng = normalize(guess), na = normalize(answerText);
  if(!ng) return false;
  if(ng===na) return true;
  if(ng.length>=3 && na.includes(ng)) return true;
  if(na.length>=3 && ng.includes(na)) return true;
  const tokensA = na.split(' ').filter(t=>t.length>=3);
  const tokensG = ng.split(' ').filter(t=>t.length>=3);
  for(const ta of tokensA){
    for(const tg of tokensG){
      if(levRatio(ta,tg) > 0.78) return true;
    }
  }
  if(levRatio(ng,na) > 0.62) return true;
  return false;
}
function findMatchIndex(guess, answers, revealed){
  for(let i=0;i<answers.length;i++){
    if(revealed[i]) continue;
    if(isMatch(guess, answers[i].t)) return i;
  }
  return -1;
}

/* ---------------- shuffle / picking questions ---------------- */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickQuestionIndices(count){
  const all = QUESTIONS.map((_,i)=>i);
  if(count>=all.length) return shuffled(all);
  return shuffled(all).slice(0,count);
}

/* ---------------- confetti ---------------- */
function fireConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const wrap = document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#0A7A3D','#D4A017','#F0C64B','#C1432E','#ffffff'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    p.style.animationDelay = (Math.random()*0.6)+'s';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(), 4200);
}

/* ---------------- app state / router ---------------- */
const app = document.getElementById('app');
let state = { screen:'home' };

function go(screen, data){
  // NOTE: explicit `screen` arg must always win, even if `data` (often the
  // previous state object) itself carries a stale `screen` field.
  state = Object.assign({}, data||{}, {screen});
  window.state = state;
  render();
}
window.state = state;
function render(){
  window.scrollTo(0,0);
  app.innerHTML = SCREENS[state.screen](state);
}


/* ============================================================
   HOME SCREEN
   ============================================================ */
function homeScreen(){
  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container">
      <div class="wordmark">
        <h1>Naija <span>Feud</span></h1>
        <p>100 Survey Questions &middot; Top Answers on the Board</p>
      </div>
      <div class="stack" style="margin-top:18px;">
        <div class="card">
          <p class="eyebrow">Play together, one device</p>
          <p style="margin:0 0 12px; font-size:14px; opacity:.75;">One person hosts, two teams call out answers. Perfect for a family gathering.</p>
          <button class="btn btn-primary" data-act="go" data-to="localSetup">Local Party Mode</button>
        </div>
        <div class="card">
          <p class="eyebrow">Play remotely, two phones</p>
          <p style="margin:0 0 12px; font-size:14px; opacity:.75;">Connect two phones directly with a one-time code — no app store, no server. Buzz in and guess head-to-head.</p>
          <button class="btn btn-gold" data-act="go" data-to="onlineSetup">Online 2-Player Mode</button>
        </div>
      </div>
      <p class="muted center-text" style="margin-top:20px;">${QUESTIONS.length} questions across 10 rounds &mdash; morning commute to weddings to football.</p>
    </div>
  </div>`;
}

    <div class="container">

function setLocalCount(n){

function startLocal(){

/* ============================================================
   LOCAL MODE — game screen
   ============================================================ */
function localGameScreen(s){
  const qObj = QUESTIONS[s.order[s.qi]];
  const leading = s.scores.A===s.scores.B ? '' : (s.scores.A>s.scores.B?'A':'B');
  let banner = '';
  if(s.phase==='faceoff'){
    banner = `<div class="status-banner">Who buzzed in first?</div>`;
  } else if(s.phase==='guessing'){
    const teamName = s.control==='A'?s.teamA:s.teamB;
    banner = `<div class="status-banner">${escapeHtml(teamName)} is guessing</div>`;
  } else if(s.phase==='steal'){
    const stealer = s.control==='A'?s.teamB:s.teamA;
    banner = `<div class="status-banner danger">Steal chance: ${escapeHtml(stealer)}</div>`;
  } else if(s.phase==='resolved'){
    banner = `<div class="status-banner win">Question complete</div>`;
  }

  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container">
      <div class="top-bar">
        <button class="back-link" data-act="confirmExitLocal">&larr; End Game</button>
        <span class="qcount">Q ${s.qi+1} / ${s.order.length}</span>
      </div>

      <div class="scoreboard">
        <div class="score-card ${leading==='A'?'leading':''} ${s.control==='A'&&s.phase==='guessing'?'active-control':''}">
          <div class="team-name">${escapeHtml(s.teamA)}</div>
          <div class="team-score">${s.scores.A}</div>
        </div>
        <div class="score-card ${leading==='B'?'leading':''} ${s.control==='B'&&s.phase==='guessing'?'active-control':''}">
          <div class="team-name">${escapeHtml(s.teamB)}</div>
          <div class="team-score">${s.scores.B}</div>
        </div>
      </div>

      ${banner}

      <div class="board-wrap">
        <div class="question-text">${escapeHtml(qObj.q)}</div>
        <div class="slots">
          ${qObj.a.map((ans,i)=>`
            <div class="slot ${s.revealed[i]?'revealed':'hidden'}" data-act="revealSlot" data-i="${i}">
              <div class="slot-inner">
                <div class="slot-num">${i+1}</div>
                <div class="slot-text">${escapeHtml(ans.t)}</div>
                <div class="slot-placeholder">?</div>
                <div class="slot-points">${ans.p}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="strikes">
          ${[0,1,2].map(i=>`<svg class="strike-x ${s.strikes>i?'active':''}" viewBox="0 0 44 44"><path d="M8 8 L36 36 M36 8 L8 36" stroke="#C1432E" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`).join('')}
        </div>
      </div>

      <div class="stack" style="margin-top:16px;">
        ${localControls(s)}
      </div>
    </div>
  </div>`;
}

function localControls(s){
  if(s.phase==='faceoff'){
    return `<div class="btn-row">
      <button class="btn btn-primary" data-act="assignControl" data-team="A">${escapeHtml(s.teamA)} Buzzed</button>
      <button class="btn btn-primary" data-act="assignControl" data-team="B">${escapeHtml(s.teamB)} Buzzed</button>
    </div>`;
  }
  if(s.phase==='guessing'){
    return `<p class="muted center-text">Tap the correct slot to reveal it, or mark a strike for a wrong guess.</p>
      <button class="btn btn-red" data-act="markStrike">Wrong Guess (Strike)</button>`;
  }
  if(s.phase==='steal'){
    return `<p class="muted center-text">Tap the slot they guess, or mark it a failed steal.</p>
      <button class="btn btn-outline" data-act="stealFail">Steal Failed</button>`;
  }
  if(s.phase==='resolved'){
    const isLast = s.qi >= s.order.length-1;
    return `<button class="btn btn-gold" data-act="nextLocalQuestion">${isLast?'See Final Score':'Next Question'}</button>`;
  }
  return '';
}

function assignControl(team){
  go('localGame', Object.assign({}, state, {control:team, phase:'guessing'}));
}
function revealSlot(i){
  const s = state;
  if(s.phase!=='guessing' && s.phase!=='steal') return;
  if(s.revealed[i]) return;
  const revealed = s.revealed.slice();
  revealed[i]=true;
  const qObj = QUESTIONS[s.order[s.qi]];
  const pts = qObj.a[i].p;
  const scores = Object.assign({}, s.scores);

  if(s.phase==='steal'){
    // stealer gets ALL remaining unrevealed points (including this one)
    const stealer = s.control==='A' ? 'B' : 'A';
    let total = 0;
    qObj.a.forEach((a,idx)=>{ if(!s.revealed[idx]) total += a.p; });
    scores[stealer] += total;
    const allRevealed = revealed.map(()=>true);
    go('localGame', Object.assign({}, s, {revealed:allRevealed, scores, phase:'resolved'}));
    return;
  }
  // normal guessing reveal
  scores[s.control] += pts;
  const allDone = revealed.every(Boolean);
  go('localGame', Object.assign({}, s, {revealed, scores, phase: allDone?'resolved':'guessing'}));
}
function markStrike(){
  const s = state;
  const strikes = s.strikes+1;
  if(strikes>=3){
    go('localGame', Object.assign({}, s, {strikes, phase:'steal'}));
  } else {
    go('localGame', Object.assign({}, s, {strikes}));
  }
}
function stealFail(){
  go('localGame', Object.assign({}, state, {phase:'resolved'}));
}
function nextLocalQuestion(){
  const s = state;
  if(s.qi >= s.order.length-1){
    go('localEnd', s);
    return;
  }
  go('localGame', Object.assign({}, s, {
    qi:s.qi+1, revealed:[false,false,false,false,false], strikes:0, control:null, phase:'faceoff'
  }));
}
function confirmExitLocal(){
  if(confirm('End this game and return to the menu?')) go('home');
}

/* ---------------- html escape helpers ---------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }


/* ============================================================
   ONLINE MODE — WebRTC peer-to-peer (manual code exchange)
   ============================================================ */
let pc = null, dc = null;
let net = { role:null, myName:'', peerName:'', status:'idle', errorMsg:'', myCode:'', busy:false };
let og  = null; // online game state, created on connect
window.net = net;
window.og = og;

const ICE_SERVERS = [
  { urls:'stun:stun.l.google.com:19302' },
  { urls:'stun:stun1.l.google.com:19302' }
];

function flip(who){ return who==='me' ? 'peer' : 'me'; }

function waitIceComplete(peerConn, timeoutMs=8000){
  return new Promise(resolve=>{
    if(peerConn.iceGatheringState==='complete'){ resolve(); return; }
    let done=false;
    const finish=()=>{ if(!done){ done=true; peerConn.removeEventListener('icegatheringstatechange',finish); resolve(); } };
    peerConn.addEventListener('icegatheringstatechange',finish);
    setTimeout(finish, timeoutMs);
  });
}
function encodeCode(desc){
  const json = JSON.stringify({type:desc.type, sdp:desc.sdp});
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeCode(code){
  const json = decodeURIComponent(escape(atob(code.trim())));
  return JSON.parse(json);
}

/* ---------------- QR: generate ---------------- */
function qrSvgFor(text){
  if(!text || typeof qrcode==='undefined') return '';
  try{
    const qr = qrcode(0, 'L'); // type 0 = auto-size, L = most data capacity
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({cellSize:4, margin:2});
  } catch(err){
    return ''; // code too long for a single QR — UI falls back to copy/paste
  }
}

/* ---------------- QR: scan ---------------- */
let scanStream = null, scanRAF = null;
function openQrScanner(onResult){
  if(typeof jsQR==='undefined'){ alert('QR scanning is not available on this browser — please use Copy/Paste instead.'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'scan-overlay';
  overlay.id = 'scanOverlay';
  overlay.innerHTML = `
    <p>Point your camera at the other device's QR code</p>
    <video id="scanVideo" playsinline autoplay muted></video>
    <button class="btn btn-outline btn-sm" style="margin-top:18px;" id="scanCancelBtn">Cancel</button>
  `;
  document.body.appendChild(overlay);
  document.getElementById('scanCancelBtn').addEventListener('click', closeQrScanner);

  const video = document.getElementById('scanVideo');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } })
    .then(stream=>{
      scanStream = stream;
      video.srcObject = stream;
      video.play();
      const tick = ()=>{
        if(!scanStream) return;
        if(video.readyState === video.HAVE_ENOUGH_DATA){
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imgData.data, imgData.width, imgData.height);
          if(code && code.data){
            const result = code.data;
            closeQrScanner();
            onResult(result);
            return;
          }
        }
        scanRAF = requestAnimationFrame(tick);
      };
      scanRAF = requestAnimationFrame(tick);
    })
    .catch(()=>{
      overlay.querySelector('p').textContent = 'Could not access the camera. Check permissions, or use Copy/Paste instead.';
    });
}
function closeQrScanner(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
  const overlay = document.getElementById('scanOverlay');
  if(overlay) overlay.remove();
}
function sendMsg(obj){
  if(dc && dc.readyState==='open') dc.send(JSON.stringify(obj));
}
function newPC(){
  const p = new RTCPeerConnection({iceServers:ICE_SERVERS});
  p.oniceconnectionstatechange = ()=>{
    if(['failed','disconnected','closed'].includes(p.iceConnectionState)){
      if(state.screen==='onlineGame' || state.screen==='onlineHostCode' || state.screen==='onlineJoinCode'){
        net.status='lost';
        render();
      }
    }
  };
  return p;
}
function setupDataChannelHandlers(){
  dc.onopen = ()=>{
    net.status='connected';
    if(net.role==='host'){
      const order = pickQuestionIndices(net.count);
      og = { role:'host', myName:net.myName, peerName:'', order, count:net.count, qi:-1,
             scores:{me:0,peer:0}, revealed:[false,false,false,false,false], strikes:0,
             phase:'lobby', control:null, buzzState:'idle', myBuzzTs:null, peerBuzzTs:null, lastResult:null };
      window.og = og;
      sendMsg({t:'hello', name:net.myName, count:net.count, order});
    } else {
      og = { role:'joiner', myName:net.myName, peerName:'', order:[], count:0, qi:-1,
             scores:{me:0,peer:0}, revealed:[false,false,false,false,false], strikes:0,
             phase:'lobby', control:null, buzzState:'idle', myBuzzTs:null, peerBuzzTs:null, lastResult:null };
      window.og = og;
    }
    render();
  };
  dc.onclose = ()=>{ net.status='lost'; render(); };
  dc.onmessage = (ev)=>{
    let msg; try{ msg = JSON.parse(ev.data); } catch(e){ return; }
    handleNetMessage(msg);
  };
}
function handleNetMessage(msg){
  if(!og && msg.t!=='hello') return;
  switch(msg.t){
    case 'hello':
      og.peerName = msg.name; og.order = msg.order; og.count = msg.count;
      sendMsg({t:'helloAck', name:net.myName});
      resetForQuestion(0);
      break;
    case 'helloAck':
      og.peerName = msg.name;
      resetForQuestion(0);
      break;
    case 'buzz':
      onPeerBuzz(msg.ts);
      break;
    case 'boardUpdate':
      onBoardUpdate(msg);
      break;
    case 'next':
      resetForQuestion(msg.idx);
      break;
    case 'bye':
      net.status='lost';
      render();
      break;
  }
}

/* ---------------- host flow ---------------- */
async function hostCreateGame(){
  net.busy = true; net.errorMsg='';
  go('onlineHostCode', {});
  try{
    pc = newPC();
    dc = pc.createDataChannel('game', {ordered:true});
    setupDataChannelHandlers();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceComplete(pc);
    net.myCode = encodeCode(pc.localDescription);
  } catch(err){
    net.errorMsg = 'Could not start connection on this device/browser.';
  }
  net.busy = false;
  render();
}
async function hostAcceptAnswer(){
  const val = document.getElementById('answerCodeInput').value.trim();
  if(!val){ return; }
  try{
    const desc = decodeCode(val);
    await pc.setRemoteDescription(desc);
    net.status='connecting';
    render();
  } catch(err){
    net.errorMsg = 'That code did not work. Ask them to resend it.';
    render();
  }
}

/* ---------------- joiner flow ---------------- */
function joinShowPasteScreen(){
  go('onlineJoinCode', {});
}
async function joinSubmitOfferCode(){
  const val = document.getElementById('offerCodeInput').value.trim();
  if(!val) return;
  net.busy = true; net.errorMsg=''; render();
  try{
    pc = newPC();
    pc.ondatachannel = (ev)=>{ dc = ev.channel; setupDataChannelHandlers(); };
    const offerDesc = decodeCode(val);
    await pc.setRemoteDescription(offerDesc);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await waitIceComplete(pc);
    net.myCode = encodeCode(pc.localDescription);
    net.status='waitingHost';
  } catch(err){
    net.errorMsg = 'That code did not look right. Double check and try again.';
  }
  net.busy = false;
  render();
}

/* ---------------- QR-triggered flows ---------------- */
function scanForJoinerOffer(){

    const el = document.getElementById('offerCodeInput');

function scanForHostAnswer(){

/* ---------------- copy / share helpers ---------------- */
function copyCode(){

  }).catch(()=>{});
}

    navigator.share({title:'Naija Feud connection code', text:net.myCode}).catch(()=>{});
  } else {
    copyCode();
  }
}

/* ---------------- gameplay: buzz ---------------- */
function pressBuzz(){
  if(!og || og.phase!=='buzzing' || og.buzzState!=='idle') return;
  og.buzzState='pendingMine';
  og.myBuzzTs = Date.now();
  sendMsg({t:'buzz', ts:og.myBuzzTs});
  render();
  setTimeout(()=>resolveBuzz(), 320);
}
function onPeerBuzz(ts){
  if(!og || og.phase!=='buzzing') return;
  og.peerBuzzTs = ts;
  if(og.buzzState==='idle'){
    og.buzzState='pendingPeer';
    render();
    setTimeout(()=>resolveBuzz(), 320);
  } else if(og.buzzState==='pendingMine'){
    resolveBuzz();
  }
}
function resolveBuzz(){
  if(!og || og.phase!=='buzzing' || og.buzzState==='resolved') return;
  if(og.myBuzzTs==null && og.peerBuzzTs==null) return;
  let winner;
  if(og.myBuzzTs!=null && og.peerBuzzTs!=null){
    winner = og.myBuzzTs===og.peerBuzzTs ? (og.role==='host'?'me':'peer') : (og.myBuzzTs<og.peerBuzzTs?'me':'peer');
  } else {
    winner = og.myBuzzTs!=null ? 'me' : 'peer';
  }
  og.buzzState='resolved';
  og.phase='guessing';
  og.control=winner;
  render();
}

/* ---------------- gameplay: guessing ---------------- */
function submitOnlineGuess(){
  if(!og || og.control!=='me') return;
  const input = document.getElementById('guessInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  const qObj = QUESTIONS[og.order[og.qi]];
  const idx = findMatchIndex(text, qObj.a, og.revealed);
  og.lastResult = { text, correct: idx>=0, by:'me' };
  applyLocalResult(qObj, idx);
}
function applyLocalResult(qObj, idx){
  let deltaAmount=0, deltaTo=null;
  if(og.phase==='steal'){
    if(idx>=0){
      let total=0; qObj.a.forEach((a,i)=>{ if(!og.revealed[i]) total+=a.p; });
      og.revealed = og.revealed.map(()=>true);
      deltaAmount=total; deltaTo='me';
      og.scores.me += total;
    }
    og.phase='resolved';
  } else {
    if(idx>=0){
      og.revealed[idx]=true;
      deltaAmount = qObj.a[idx].p; deltaTo='me';
      og.scores.me += deltaAmount;
      og.phase = og.revealed.every(Boolean) ? 'resolved' : 'guessing';
    } else {
      og.strikes++;
      if(og.strikes>=3){
        og.control = flip(og.control);
        og.phase='steal';
      } else {
        og.phase='guessing';
      }
    }
  }
  sendMsg({t:'boardUpdate', revealed:og.revealed, strikes:og.strikes, phase:og.phase, control:og.control,
           deltaAmount, deltaTo, lastResult: og.lastResult});
  if(og.phase==='resolved'){ scheduleAutoAdvance(); }
  else { render(); }
}
function onBoardUpdate(msg){
  og.revealed = msg.revealed.slice();
  og.strikes = msg.strikes;
  og.phase = msg.phase;
  og.control = flip(msg.control);
  if(msg.deltaTo) og.scores[flip(msg.deltaTo)] += msg.deltaAmount;
  if(msg.lastResult) og.lastResult = Object.assign({}, msg.lastResult, {by:'peer'});
  render();
}
function scheduleAutoAdvance(){
  render();
  setTimeout(()=>{
    const nextIdx = og.qi+1;
    sendMsg({t:'next', idx:nextIdx});
    resetForQuestion(nextIdx);
  }, 3000);
}
function resetForQuestion(idx){
  if(idx >= og.order.length){
    go('onlineEnd', {});
    return;
  }
  og.qi=idx; og.revealed=[false,false,false,false,false]; og.strikes=0; og.phase='buzzing';
  og.control=null; og.buzzState='idle'; og.myBuzzTs=null; og.peerBuzzTs=null; og.lastResult=null;
  go('onlineGame', {});
}
function leaveOnlineGame(){
  if(!confirm('Leave the game?')) return;
  sendMsg({t:'bye'});
  teardownConnection();
  go('home');
}
function teardownConnection(){
  try{ if(dc) dc.close(); }catch(e){}
  try{ if(pc) pc.close(); }catch(e){}
  dc=null; pc=null; og=null;
  window.og = og;
  net = { role:null, myName:net.myName, peerName:'', status:'idle', errorMsg:'', myCode:'', busy:false, count:20 };
  window.net = net;
}

  return `

          <label class="field-label">Number of Questions (host picks)</label>
          <div class="btn-row">
            ${[10,20,30].map(n=>`<button class="btn ${count===n?'btn-primary':'btn-outline'} btn-sm" data-act="setOnlineCount" data-n="${n}">${n}</button>`).join('')}
          </div>
        </div>
      </div>

      <div class="stack" style="margin-top:16px;">
        <button class="btn btn-primary" data-act="startHost">Create Game (I'll Host)</button>
        <button class="btn btn-outline" data-act="startJoin">Join a Friend's Game</button>
      </div>
      <p class="muted center-text" style="margin-top:16px;">One person taps <b>Create Game</b> and sends the code that appears to the other player. They tap <b>Join a Friend's Game</b> and paste it in. Works over WiFi or mobile data — keep both phones online until you're connected.</p>
    </div>
  </div>`;
}
function setOnlineCount(n){
  const nameEl = document.getElementById('nameInput');
  if(nameEl) net.myName = nameEl.value;
  net.count = n;
  render();
}
function startHostFlow(){
  const nameEl = document.getElementById('nameInput');
  net.myName = (nameEl && nameEl.value.trim()) || 'Host';
  net.role = 'host';
  hostCreateGame();
}
function startJoinFlow(){
  const nameEl = document.getElementById('nameInput');
  net.myName = (nameEl && nameEl.value.trim()) || 'Player 2';
  net.role = 'joiner';
  joinShowPasteScreen();
}

/* ---------------- host code screen ---------------- */
function onlineHostCodeScreen(){
  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container">
      <button class="back-link" data-act="leaveSetup">&larr; Cancel</button>
      <div class="wordmark" style="padding-top:6px;"><h1 style="font-size:24px;">Step 1 &middot; Send This Code</h1></div>

      ${net.errorMsg ? `<div class="status-banner danger">${escapeHtml(net.errorMsg)}</div>` : ''}

      ${!net.myCode ? `
        <div class="card center-text"><div class="spinner"></div><p class="muted" style="margin-top:12px;">Generating your connection code&hellip;</p></div>
      ` : `
        <div class="card">
          <p class="eyebrow">Have them scan this code</p>
          ${qrSvgFor(net.myCode) ? `<div class="qr-wrap">${qrSvgFor(net.myCode)}</div>` : `<p class="qr-fallback">QR unavailable for this connection — use Copy Code below.</p>`}
          <p class="muted" style="margin:0 0 10px;">Or send this code — send this to ${escapeHtml('your friend')}</p>
          <div class="code-box" id="codeOutput">${net.myCode}</div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="btn btn-gold btn-sm" id="copyBtn" data-act="copyCode">Copy Code</button>
            <button class="btn btn-outline btn-sm" data-act="shareCode">Share&hellip;</button>
          </div>
        </div>

        <div class="divider">Then</div>

        <div class="card">
          <p class="eyebrow">Step 2 &middot; Get their reply code</p>
          <p class="muted" style="margin:0 0 10px;">They'll join and get a second code — scan it from their screen, or paste it below.</p>
          <button class="btn btn-gold" style="margin-bottom:12px;" data-act="scanForHostAnswer">Scan Their QR</button>
          <textarea id="answerCodeInput" placeholder="...or paste their code here"></textarea>
          <button class="btn btn-primary" style="margin-top:12px;" data-act="hostAcceptAnswer">Connect</button>
        </div>
      `}

      ${net.status==='connecting' ? `<div class="card center-text" style="margin-top:14px;"><div class="spinner"></div><p class="muted" style="margin-top:12px;">Connecting&hellip;</p></div>` : ''}
      ${net.status==='connected' ? `<div class="card center-text" style="margin-top:14px;"><div class="spinner"></div><p class="muted" style="margin-top:12px;">Linking up the game&hellip;</p></div>` : ''}
      ${net.status==='lost' ? `<div class="status-banner danger" style="margin-top:14px;">Connection lost. Go back and try again.</div>` : ''}
    </div>
  </div>`;
}

/* ---------------- joiner code screen ---------------- */
function onlineJoinCodeScreen(){
  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container">
      <button class="back-link" data-act="leaveSetup">&larr; Cancel</button>
      <div class="wordmark" style="padding-top:6px;"><h1 style="font-size:24px;">Join Game</h1></div>

      ${net.errorMsg ? `<div class="status-banner danger">${escapeHtml(net.errorMsg)}</div>` : ''}

      ${!net.myCode ? `
        <div class="card">
          <p class="eyebrow">Scan their QR code</p>
          <button class="btn btn-gold" style="margin-bottom:12px;" data-act="scanForJoinerOffer">Scan QR</button>
          <p class="muted" style="margin:4px 0 10px;">...or paste the code they sent you</p>
          <textarea id="offerCodeInput" placeholder="Paste code here"></textarea>
          <button class="btn btn-primary" style="margin-top:12px;" data-act="joinSubmitOfferCode" ${net.busy?'disabled':''}>${net.busy?'Working…':'Continue'}</button>
        </div>
      ` : `
        <div class="card">
          <p class="eyebrow">Have them scan this to finish connecting</p>
          ${qrSvgFor(net.myCode) ? `<div class="qr-wrap">${qrSvgFor(net.myCode)}</div>` : `<p class="qr-fallback">QR unavailable for this connection — use Copy Code below.</p>`}
          <p class="muted" style="margin:0 0 10px;">Or send this code back to them</p>
          <div class="code-box" id="codeOutput">${net.myCode}</div>
          <div class="btn-row" style="margin-top:12px;">
            <button class="btn btn-gold btn-sm" id="copyBtn" data-act="copyCode">Copy Code</button>
            <button class="btn btn-outline btn-sm" data-act="shareCode">Share&hellip;</button>
          </div>
        </div>
        <div class="card center-text" style="margin-top:14px;">
          <div class="spinner"></div>
          <p class="muted" style="margin-top:12px;">Waiting for them to connect&hellip;</p>
        </div>
      `}
      ${net.status==='lost' ? `<div class="status-banner danger" style="margin-top:14px;">Connection lost. Go back and try again.</div>` : ''}
    </div>
  </div>`;
}
function leaveSetup(){
  teardownConnection();
  go('onlineSetup');
}

/* ============================================================
   ONLINE MODE — gameplay screen
   ============================================================ */
function onlineGameScreen(){
  if(!og) return `<div class="screen active"><div class="container center-text"><div class="spinner" style="margin-top:60px;"></div></div></div>`;
  if(og.phase==='lobby'){
    return `<div class="screen active"><div class="stripe-band"></div><div class="container center-text">
      <div class="wordmark"><h1 style="font-size:24px;">Connected!</h1></div>
      <div class="spinner"></div><p class="muted" style="margin-top:12px;">Getting the board ready&hellip;</p>
    </div></div>`;
  }

  const qObj = QUESTIONS[og.order[og.qi]];
  const myScore = og.scores.me, peerScore = og.scores.peer;
  const leadingMe = myScore>peerScore, leadingPeer = peerScore>myScore;

  let banner = '';
  if(og.phase==='buzzing'){
    if(og.buzzState==='idle') banner = `<div class="status-banner">First to buzz gets to guess!</div>`;
    else if(og.buzzState==='pendingMine') banner = `<div class="status-banner">Buzzing in&hellip;</div>`;
    else if(og.buzzState==='pendingPeer') banner = `<div class="status-banner">${escapeHtml(og.peerName)} buzzed &mdash; confirming&hellip;</div>`;
  } else if(og.phase==='guessing'){
    banner = og.control==='me'
      ? `<div class="status-banner win">Your turn &mdash; type a guess below</div>`
      : `<div class="status-banner">${escapeHtml(og.peerName)} is guessing&hellip;</div>`;
  } else if(og.phase==='steal'){
    banner = og.control==='me'
      ? `<div class="status-banner danger">Steal chance! One guess for it all</div>`
      : `<div class="status-banner danger">${escapeHtml(og.peerName)} has a steal chance</div>`;
  } else if(og.phase==='resolved'){
    banner = `<div class="status-banner win">Next question coming up&hellip;</div>`;
  }

  let resultLine = '';
  if(og.lastResult){
    const who = og.lastResult.by==='me' ? 'You' : escapeHtml(og.peerName);
    resultLine = `<p class="muted center-text" style="margin:6px 0 0;">${who} guessed &ldquo;${escapeHtml(og.lastResult.text)}&rdquo; &mdash; ${og.lastResult.correct?'correct!':'not on the board.'}</p>`;
  }

  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container">
      <div class="top-bar">
        <button class="back-link" data-act="leaveOnlineGame">&larr; Leave</button>
        <span class="qcount">Q ${og.qi+1} / ${og.order.length}</span>
      </div>

      <div class="scoreboard">
        <div class="score-card ${leadingMe?'leading':''} ${og.control==='me'?'active-control':''}">
          <div class="team-name">You</div>
          <div class="team-score">${myScore}</div>
        </div>
        <div class="score-card ${leadingPeer?'leading':''} ${og.control==='peer'?'active-control':''}">
          <div class="team-name">${escapeHtml(og.peerName||'Opponent')}</div>
          <div class="team-score">${peerScore}</div>
        </div>
      </div>

      ${banner}

      <div class="board-wrap">
        <div class="question-text">${escapeHtml(qObj.q)}</div>
        <div class="slots">
          ${qObj.a.map((ans,i)=>`
            <div class="slot ${og.revealed[i]?'revealed':'hidden'}">
              <div class="slot-inner">
                <div class="slot-num">${i+1}</div>
                <div class="slot-text">${escapeHtml(ans.t)}</div>
                <div class="slot-placeholder">?</div>
                <div class="slot-points">${ans.p}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="strikes">
          ${[0,1,2].map(i=>`<svg class="strike-x ${og.strikes>i?'active':''}" viewBox="0 0 44 44"><path d="M8 8 L36 36 M36 8 L8 36" stroke="#C1432E" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`).join('')}
        </div>
      </div>
      ${resultLine}

      <div class="stack" style="margin-top:16px;">
        ${onlineControls()}
      </div>
    </div>
  </div>`;
}
function onlineControls(){
  if(og.phase==='buzzing'){
    const locked = og.buzzState!=='idle';
    return `<button class="btn btn-red" style="padding:26px; font-size:22px;" data-act="pressBuzz" ${locked?'disabled':''}>BUZZ IN</button>`;
  }
  if((og.phase==='guessing' || og.phase==='steal') && og.control==='me'){
    return `<div class="guess-row">
      <input type="text" id="guessInput" placeholder="Type your guess" autofocus>
      <button class="btn btn-primary btn-sm" data-act="submitOnlineGuess">Guess</button>
    </div>`;
  }
  if((og.phase==='guessing' || og.phase==='steal') && og.control==='peer'){
    return `<p class="muted center-text">Waiting for ${escapeHtml(og.peerName)}&hellip;</p>`;
  }
  return '';
}

/* ---------------- online end screen ---------------- */
function onlineEndScreen(){
  if(!og) return homeScreen();
  const myScore = og.scores.me, peerScore = og.scores.peer;
  const winner = myScore===peerScore ? null : (myScore>peerScore ? 'You' : (og.peerName||'Opponent'));
  setTimeout(fireConfetti, 100);
  return `
  <div class="screen active">
    <div class="stripe-band"></div>
    <div class="container center-text">
      <div class="wordmark"><h1 style="font-size:30px;">Game Over</h1></div>
      <div class="card" style="margin-top:10px;">
        ${winner ? `<p class="pill" style="margin-bottom:10px;">Winner</p><h2 class="display" style="margin:0 0 16px; color:var(--green-dk);">${escapeHtml(winner)}</h2>` : `<h2 class="display" style="margin:0 0 16px;">It's a Tie!</h2>`}
        <div class="scoreboard">
          <div class="score-card ${myScore>=peerScore?'leading':''}"><div class="team-name">You</div><div class="team-score">${myScore}</div></div>
          <div class="score-card ${peerScore>=myScore?'leading':''}"><div class="team-name">${escapeHtml(og.peerName||'Opponent')}</div><div class="team-score">${peerScore}</div></div>
        </div>
      </div>
      <div class="stack" style="margin-top:20px;">
        <button class="btn btn-primary" data-act="endOnlineToMenu">Main Menu</button>
      </div>
    </div>
  </div>`;
}
function endOnlineToMenu(){
  sendMsg({t:'bye'});
  teardownConnection();
  go('home');
}

/* ============================================================
   ROUTER TABLE + EVENT DELEGATION + BOOTSTRAP
   ============================================================ */
const SCREENS = {
  home: homeScreen,
  localSetup: localSetupScreen,
  localGame: localGameScreen,
  localEnd: localEndScreen,
  onlineSetup: onlineSetupScreen,
  onlineHostCode: onlineHostCodeScreen,
  onlineJoinCode: onlineJoinCodeScreen,
  onlineGame: onlineGameScreen,
  onlineEnd: onlineEndScreen
};

const ACTIONS = {
  go: (ds)=> go(ds.to),
  setLocalCount: (ds)=> setLocalCount(Number(ds.n)),
  startLocal: ()=> startLocal(),
  assignControl: (ds)=> assignControl(ds.team),
  revealSlot: (ds)=> revealSlot(Number(ds.i)),
  markStrike: ()=> markStrike(),
  stealFail: ()=> stealFail(),
  nextLocalQuestion: ()=> nextLocalQuestion(),
  confirmExitLocal: ()=> confirmExitLocal(),
  setOnlineCount: (ds)=> setOnlineCount(Number(ds.n)),
  startHost: ()=> startHostFlow(),
  startJoin: ()=> startJoinFlow(),
  leaveSetup: ()=> leaveSetup(),
  hostAcceptAnswer: ()=> hostAcceptAnswer(),
  joinSubmitOfferCode: ()=> joinSubmitOfferCode(),
  scanForJoinerOffer: ()=> scanForJoinerOffer(),
  scanForHostAnswer: ()=> scanForHostAnswer(),
  copyCode: ()=> copyCode(),
  shareCode: ()=> shareCode(),
  pressBuzz: ()=> pressBuzz(),
  submitOnlineGuess: ()=> submitOnlineGuess(),
  leaveOnlineGame: ()=> leaveOnlineGame(),
  endOnlineToMenu: ()=> endOnlineToMenu()
};

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(ACTIONS[act]) ACTIONS[act](el.dataset);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    if(e.target.id==='answerCodeInput'){ e.preventDefault(); hostAcceptAnswer(); }
    if(e.target.id==='offerCodeInput'){ e.preventDefault(); joinSubmitOfferCode(); }
    if(e.target.id==='guessInput'){ e.preventDefault(); submitOnlineGuess(); }
  }
});

go('home');

</script>
</body>
</html>
